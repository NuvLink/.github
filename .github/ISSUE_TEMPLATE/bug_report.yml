name: Bug Report
description: Reportar um problema em uma automação, integração ou sistema existente
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição do problema
      description: O que está acontecendo?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      options:
        - Crítica (produção parada / cliente impactado)
        - Alta
        - Média
        - Baixa
    validations:
      required: true
